name: uji-ip-eksternal
on:
  workflow_dispatch:
jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: IP publik runner
        run: |
          echo "IP: $(curl -sS -m 10 https://api.ipify.org || echo gagal)"
          echo "UA: $(curl -sS -m 10 https://api.ipify.org -A test || true)"
      - name: GET infopemilu.kpu.go.id
        run: |
          curl -sS -m 15 -o /dev/null -w "KPU GET /      -> HTTP %{http_code} (%{time_total}s)\n" \
            https://infopemilu.kpu.go.id/ || echo "KPU GET GAGAL (exit $?)"
      - name: POST SIPOL (getDataFromAjx)
        run: |
          curl -sS -m 15 -X POST \
            -H "Content-Type: application/x-www-form-urlencoded; charset=UTF-8" \
            -H "Referer: https://infopemilu.kpu.go.id/Pemilu/Cari_nik" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            --data "input_ajx=3311022506760001" \
            -w "\nKPU POST -> HTTP %{http_code} (%{time_total}s)\n" \
            "https://infopemilu.kpu.go.id/Pemilu/Cari_nik_parpol/getDataFromAjx" | head -c 700 \
            || echo "KPU POST GAGAL (exit $?)"
      - name: GET cekbansos.kemensos.go.id
        run: |
          curl -sS -m 15 -o /dev/null -w "Kemensos GET / -> HTTP %{http_code} (%{time_total}s)\n" \
            https://cekbansos.kemensos.go.id/ || echo "Kemensos GET GAGAL (exit $?)"
