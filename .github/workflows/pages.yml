# Sinkronkan folder github/ ke branch gh-pages (sumber GitHub Pages)
name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan isi situs
        run: |
          rm -rf site
          cp -r github site
          touch site/.nojekyll

      - name: Push ke branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./site
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force_orphan: true
