<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tes Tiruan Cek NIK — UI SIPOL KPU, data via worker+relai</title>
<style>
/* dasar minimal — padanan bootstrap yang sengaja tidak ikut disalin */
body{margin:0;background:#eef2f7;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1e293b}
.container{max-width:680px;margin:0 auto;padding:24px 16px}
/* ==== gaya asli KPU, disalin apa adanya ==== */
<style>
  /* ── RESET & BASE ─────────────────────────────── */
  * {
    box-sizing: border-box;
  }

  .search-card {
    background: #ffffff;
    border-radius: 16px;
    padding: 28px 24px;
    margin-top: 20px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.07);
  }

  /* ── ALERT BOX ────────────────────────────────── */
  .alert-inline {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 14px;
  }

  .alert-inline.error {
    background: #fff0f0;
    color: #b91c1c;
    border: 1px solid #fecaca;
    display: flex;
  }

  .alert-inline.info {
    background: #eff6ff;
    color: #1d4ed8;
    border: 1px solid #bfdbfe;
    display: flex;
  }

  /* ── NIK INPUT ────────────────────────────────── */
  .nik-wrap {
    position: relative;
    margin-bottom: 8px;
  }

  .nik-input {
    width: 100%;
    font-family: 'Courier New', monospace;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.14em;
    padding: 14px 60px 14px 16px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    color: #1e293b;
    background: #f8fafc;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .nik-input:focus {
    border-color: #3b82f6;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
  }

  .nik-input.complete {
    border-color: #22c55e;
    background: #f0fdf4;
  }

  .char-counter {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    font-weight: 600;
    color: #94a3b8;
    font-family: monospace;
    transition: color 0.2s;
  }

  .char-counter.done {
    color: #16a34a;
  }

  /* ── PROGRESS DOTS ────────────────────────────── */
  .progress-dots {
    display: flex;
    gap: 3px;
    margin-bottom: 16px;
    padding: 0 2px;
  }

  .prog-dot {
    flex: 1;
    height: 4px;
    border-radius: 4px;
    background: #e2e8f0;
    transition: background 0.15s;
  }

  .prog-dot.filled {
    background: maroon;
  }

  .prog-dot.done {
    background: #22c55e;
  }

  /* ── TURNSTILE ────────────────────────────────── */
  .turnstile-wrap {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .turnstile-label {
    font-size: 13px;
    color: #64748b;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ── SEARCH BUTTON ────────────────────────────── */
  .btn-cari {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: maroon;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: opacity 0.2s, transform 0.1s;
    letter-spacing: 0.02em;
  }

  .btn-cari:hover {
    opacity: 0.92;
  }

  .btn-cari:active {
    transform: scale(0.99);
  }

  .btn-cari:disabled {
    background: #94a3b8;
    cursor: not-allowed;
    transform: none;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .spin {
    animation: spin 0.7s linear infinite;
    display: inline-block;
  }

  /* ── SKELETON ─────────────────────────────────── */
  .skeleton-wrap {
    margin-top: 20px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #e2e8f0;
  }

  .skeleton-header {
    height: 52px;
    background: #e2e8f0;
    animation: shimmer 1.4s ease-in-out infinite;
  }

  .skeleton-body {
    padding: 16px;
  }

  .skel-line {
    height: 12px;
    border-radius: 6px;
    background: #e2e8f0;
    margin-bottom: 12px;
    animation: shimmer 1.4s ease-in-out infinite;
  }

  @keyframes shimmer {

    0%,
    100% {
      opacity: 1;
    }

    50% {
      opacity: 0.45;
    }
  }

  /* ── RESULT CARD ──────────────────────────────── */
  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(10px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .result-card {
    background: #fff;
    border-radius: 14px;
    border: 1px solid #e2e8f0;
    margin-top: 16px;
    overflow: hidden;
    animation: fadeUp 0.35s ease;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
  }

  .rc-header {
    background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
    border-bottom: 1px solid #bfdbfe;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .rc-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .rc-status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
    flex-shrink: 0;
  }

  .rc-header-text .rc-title {
    font-size: 13px;
    font-weight: 700;
    color: #1e40af;
  }

  .rc-header-text .rc-sub {
    font-size: 11px;
    color: #3b82f6;
  }

  .rc-badge {
    background: #dcfce7;
    color: #15803d;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid #bbf7d0;
    white-space: nowrap;
  }

  .rc-body {
    padding: 16px;
  }

  .rc-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .rc-field-full {
    grid-column: 1 / -1;
  }

  .rc-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #94a3b8;
    margin-bottom: 3px;
  }

  .rc-value {
    font-size: 14px;
    font-weight: 600;
    color: #1e293b;
    word-break: break-word;
  }

  .rc-value.mono {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: #0f172a;
  }

  .rc-footer {
    padding: 10px 16px;
    border-top: 1px solid #f1f5f9;
    background: #f8fafc;
    font-size: 11px;
    color: #94a3b8;
    text-align: right;
  }

  /* ── EMPTY STATE ──────────────────────────────── */
  .empty-state {
    text-align: center;
    padding: 28px 16px;
    margin-top: 16px;
    background: #fff;
    border-radius: 14px;
    border: 1px dashed #e2e8f0;
    animation: fadeUp 0.3s ease;
  }

  .empty-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #fff0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin: 0 auto 12px;
  }

  .empty-state h3 {
    font-size: 15px;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 4px;
  }

  .empty-state p {
    font-size: 13px;
    color: #64748b;
  }

  /* ── MULTI NOTICE ─────────────────────────────── */
  .multi-notice {
    text-align: center;
    font-size: 12px;
    color: #64748b;
    margin-top: 10px;
    padding: 6px;
    background: #f1f5f9;
    border-radius: 8px;
  }

  @media (max-width: 400px) {
    .rc-grid {
      grid-template-columns: 1fr;
    }

    .rc-field-full {
      grid-column: 1;
    }

    .nik-input {
      font-size: 16px;
      letter-spacing: 0.08em;
    }
  }
</style>
</style>
</head>
<body>
<div style="max-width:680px;margin:12px auto 0;padding:0 16px;font-size:12px;color:#64748b;line-height:1.5">
Tiruan — CSS, markup, dan logika render disalin dari infopemilu.kpu.go.id/Pemilu/Cari_nik. 
Perbedaan: permintaan diganti ke worker Cloudflare (data via relai PC); NIK di-mask oleh server, nama ditampilkan utuh.
</div>
<!-- MAIN -->
<div class="container">
  <div class="search-card">

    <!-- LOGO & JUDUL -->
    <div class="text-center mb-4">
      <img src="https://infopemilu.kpu.go.id/assets/img2/kpu.png" width="64" style="margin-bottom:10px;">
      <h5 style="font-weight:700; color:#1e293b; margin-bottom:4px;">Cek Anggota & Pengurus Parpol</h5>
      <small style="color:#64748b;">Masukkan NIK 16 digit untuk pengecekan data SIPOL</small>
    </div>

    <!-- ALERT INLINE -->
    <div class="alert-inline" id="alertBox">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" style="flex-shrink:0">
        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z" />
        <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0zM7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.553.553 0 0 1-1.1 0L7.1 4.995z" />
      </svg>
      <span id="alertText"></span>
    </div>

    <!-- INPUT NIK -->
    <label style="font-size:12px; font-weight:700; color:#475569; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px; display:block;">
      Nomor Induk Kependudukan (NIK)
    </label>
    <div class="nik-wrap">
      <input
        type="text"
        id="search_inponow"
        class="nik-input"
        placeholder="0000000000000000"
        maxlength="16"
        inputmode="numeric"
        autocomplete="off">
      <span class="char-counter" id="charCount">0/16</span>
    </div>

    <!-- PROGRESS DOTS -->
    <div class="progress-dots" id="progressDots"></div>

    <!-- TURNSTILE -->
   

    <!-- TOMBOL -->
    <button id="btnCari" class="btn-cari" onclick="SearchAjax()">
      <svg id="iconSearch" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398l3.85 3.85a1 1 0 0 0 1.415-1.415l-3.85-3.85a1 1 0 0 0-.018.017zm-5.242 1.156a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z" />
      </svg>
      <span id="btnText">Cari Data</span>
    </button>

    <!-- HASIL -->
    <div id="hasilSearch"></div>

  </div>
</div>

<script>
var API_URL = "https://divine-fog-0a93.riacaya99.workers.dev";
/* ── BUILD PROGRESS DOTS ──────────────────────── */
  (function() {
    var wrap = document.getElementById('progressDots');
    for (var i = 0; i < 16; i++) {
      var d = document.createElement('div');
      d.className = 'prog-dot';
      d.id = 'dot' + i;
      wrap.appendChild(d);
    }
  })();

  /* ── INPUT HANDLER ────────────────────────────── */
  document.getElementById('search_inponow').addEventListener('input', function() {
    this.value = this.value.replace(/[^0-9]/g, '');
    var len = this.value.length;
    var done = (len === 16);

    // counter
    var cc = document.getElementById('charCount');
    cc.textContent = len + '/16';
    cc.className = 'char-counter' + (done ? ' done' : '');

    // input border
    this.className = 'nik-input' + (done ? ' complete' : '');

    // dots
    for (var i = 0; i < 16; i++) {
      var dot = document.getElementById('dot' + i);
      if (i < len) {
        dot.className = 'prog-dot ' + (done ? 'done' : 'filled');
      } else {
        dot.className = 'prog-dot';
      }
    }

    hideAlert();
  });

  document.getElementById('search_inponow').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') SearchAjax();
  });

  /* ── ALERT ────────────────────────────────────── */
  function showAlert(msg) {
    var box = document.getElementById('alertBox');
    document.getElementById('alertText').textContent = msg;
    box.className = 'alert-inline error';
  }

  function hideAlert() {
    document.getElementById('alertBox').className = 'alert-inline';
  }

  /* ── SKELETON ─────────────────────────────────── */
  function showSkeleton() {
    document.getElementById('hasilSearch').innerHTML =
      '<div class="skeleton-wrap">' +
      '<div class="skeleton-header"></div>' +
      '<div class="skeleton-body">' +
      '<div class="skel-line" style="width:55%"></div>' +
      '<div class="skel-line" style="width:75%"></div>' +
      '<div class="skel-line" style="width:60%"></div>' +
      '<div class="skel-line" style="width:80%; margin-bottom:0"></div>' +
      '</div>' +
      '</div>';
  }

  /* ── SET BUTTON STATE ─────────────────────────── */
  function setBtnLoading(loading) {
    var btn = document.getElementById('btnCari');
    var iconWrap = document.getElementById('iconSearch');
    var txtEl = document.getElementById('btnText');

    if (loading) {
      btn.disabled = true;
      txtEl.textContent = 'Mencari data...';
      iconWrap.innerHTML =
        '<path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>' +
        '<path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>';
      iconWrap.style.animation = 'spin 0.7s linear infinite';
    } else {
      btn.disabled = false;
      txtEl.textContent = 'Cari Data';
      iconWrap.innerHTML =
        '<path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398l3.85 3.85a1 1 0 0 0 1.415-1.415l-3.85-3.85a1 1 0 0 0-.018.017zm-5.242 1.156a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/>';
      iconWrap.style.animation = '';
    }
  }

  /* ── MAIN SEARCH ──────────────────────────────── */
  function SearchAjax() {
    var nik = document.getElementById('search_inponow').value.trim();

    hideAlert();

    
    if (nik.length !== 16) {
      showAlert('NIK harus tepat 16 digit angka.');
      document.getElementById('search_inponow').focus();
      return;
    }

    setBtnLoading(true);
    showSkeleton();

        fetch(API_URL + '/api/check?nik=' + encodeURIComponent(nik))
      .then(function(rsp) { return rsp.json().catch(function() { return { error: 'Respons server tidak terbaca.' }; }); })
      .then(function(w) {
        if (w.error) { renderResult(w, nik); return; }
        var kpu = w.sumber && w.sumber.kpu;
        if (!w.nama || !w.nama.found) {
          if (kpu && kpu.state === 'error') {
            document.getElementById('hasilSearch').innerHTML = '';
            showAlert(w.galat && w.galat.length ? w.galat.join(' · ') : 'Gagal menghubungi server cek.');
            return;
          }
          renderResult([], nik);
          return;
        }
        renderResult([{
          nik: w.nikMasked,
          nama: w.nama.value,
          nama_parpol: w.nama.partai,
          jabatan: w.nama.jabatan,
          unit: w.nama.unit,
          tingkat_wilayah_kepengurusan: w.nama.tingkat,
          nama_wilayah: w.nama.wilayah
        }], nik);
      })
      .catch(function() {
        document.getElementById('hasilSearch').innerHTML = '';
        showAlert('Terjadi kesalahan pada server. Silakan coba lagi.');
      })
      .then(function() { setBtnLoading(false); });
  }

  /* ── SAFE VALUE ───────────────────────────────── */
  function safeVal(val) {
    return (val === null || val === undefined || val === '') ? '—' : val;
  }

  /* ── RENDER RESULT ────────────────────────────── */
  function renderResult(data, nik) {
    var wrap = document.getElementById('hasilSearch');

    // Error dari server (field error di JSON)
    if (data && data.error) {
      wrap.innerHTML =
        '<div class="empty-state">' +
        '<div class="empty-icon">⚠️</div>' +
        '<h3>Verifikasi Gagal</h3>' +
        '<p>' + data.error + '</p>' +
        '</div>';
      return;
    }

    // Tidak ditemukan
    if (!data || (Array.isArray(data) && data.length === 0)) {
      wrap.innerHTML =
        '<div class="empty-state">' +
        '<div class="empty-icon">🔍</div>' +
        '<h3>Data Tidak Ditemukan</h3>' +
        '<p>NIK <strong>' + nik + '</strong> tidak terdaftar di SIPOL.</p>' +
        '</div>';
      return;
    }

    var list = Array.isArray(data) ? data : [data];
    var today = new Date().toLocaleDateString('id-ID', {
      day: '2-digit',
      month: 'long',
      year: 'numeric'
    });
    var html = '';

    list.forEach(function(d, i) {
      html +=
        '<div class="result-card">' +

        // HEADER
        '<div class="rc-header">' +
        '<div class="rc-header-left">' +
        '<div class="rc-status-dot"></div>' +
        '<div class="rc-header-text">' +
        '<div class="rc-title">Terdaftar di SIPOL</div>' +
        '<div class="rc-sub">Anggota / Pengurus Partai Politik · Calon Peserta Pemilu</div>' +
        '</div>' +
        '</div>' +
        '<span class="rc-badge">✔ Aktif</span>' +
        '</div>' +

        // BODY
        '<div class="rc-body">' +
        '<div class="rc-grid">' +

        '<div>' +
        '<div class="rc-label">NIK</div>' +
        '<div class="rc-value mono">' + safeVal(d.nik) + '</div>' +
        '</div>' +

        '<div>' +
        '<div class="rc-label">Nama Lengkap</div>' +
        '<div class="rc-value">' + safeVal(d.nama) + '</div>' +
        '</div>' +

        '<div>' +
        '<div class="rc-label">Partai Politik</div>' +
        '<div class="rc-value">' + safeVal(d.nama_parpol) + '</div>' +
        '</div>' +

        '<div>' +
        '<div class="rc-label">Jabatan</div>' +
        '<div class="rc-value">' + safeVal(d.jabatan) + '</div>' +
        '</div>' +

        '<div>' +
        '<div class="rc-label">Unit</div>' +
        '<div class="rc-value">' + safeVal(d.unit) + '</div>' +
        '</div>' +

        '<div>' +
        '<div class="rc-label">Tingkat Wilayah</div>' +
        '<div class="rc-value">' + safeVal(d.tingkat_wilayah_kepengurusan) + '</div>' +
        '</div>' +

        '<div class="rc-field-full">' +
        '<div class="rc-label">Nama Wilayah</div>' +
        '<div class="rc-value">' + safeVal(d.nama_wilayah) + '</div>' +
        '</div>' +

        '</div>' +
        '</div>' +

        // FOOTER
        '<div class="rc-footer">Pengecekan dilakukan pada ' + today + '</div>' +

        '</div>';
    });

    // Notifikasi jika lebih dari 1 data
    if (list.length > 1) {
      html += '<div class="multi-notice">Ditemukan <strong>' + list.length + ' data</strong> terkait NIK ini</div>';
    }

    wrap.innerHTML = html;
  }

</script>
</body>
</html>
